<section class="container my-5 py-5" id="skills">
  <h2 class="section-title">Technical Skills</h2>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    @for (group of skillCategories; track group.category) {
      <div class="col">
        <div class="card custom-card p-4 h-100">
          <h4 class="text-gold mb-3">{{ group.category }}</h4>
          <div class="d-flex flex-wrap gap-2">
            @for (skill of group.items; track skill) {
              <span class="tech-tag">{{ skill }}</span>
            }
          </div>
        </div>
      </div>
    }
  </div>
</section>
