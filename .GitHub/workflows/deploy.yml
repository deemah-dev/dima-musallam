
name: Deploy Angular Portfolio

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Verify build output
        run: |
          echo "Current directory:"
          pwd
          echo "Build output:"
          ls -la dist/dima-musallam/browser
          echo "Checking index.html:"
          test -f dist/dima-musallam/browser/index.html
          echo "Checking JavaScript and CSS:"
          find dist/dima-musallam/browser -maxdepth 1 -type f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dima-musallam/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
